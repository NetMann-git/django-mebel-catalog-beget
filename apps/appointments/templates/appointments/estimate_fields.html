<div class="estimate-fields">{% for field in form %}<div class="estimate-field {{ field_class }}{% if field.name == 'comment' or field.name == 'reference_photo' %} estimate-field-wide fk-field-wide{% endif %}"{% if field.name == 'layout' %} data-estimate-layout{% endif %}><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small id="{{ field.id_for_label }}-help">{{ field.help_text }}</small>{% endif %}{% if field.errors %}<div class="estimate-error" id="{{ field.id_for_label }}-error">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}</div>{% endfor %}</div>
