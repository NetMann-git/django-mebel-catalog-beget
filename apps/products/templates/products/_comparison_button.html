<button class="compare-btn{% if product.id in comparison_ids %} active{% endif %} fm-compare-toggle" data-product-id="{{ product.pk }}" data-product-title="{{ product.title }}" data-url="{% url 'catalog:toggle_comparison_ajax' product.pk %}" type="button" aria-pressed="{% if product.id in comparison_ids %}true{% else %}false{% endif %}" aria-label="{% if product.id in comparison_ids %}Убрать из сравнения{% else %}Добавить к сравнению{% endif %}: {{ product.title }}">{% include 'home/includes/furniture_icon.html' with icon='compare' icon_class='fm-compare-icon' %}<span data-comparison-label>{% if product.id in comparison_ids %}Убрать из сравнения{% else %}Добавить к сравнению{% endif %}</span></button>
