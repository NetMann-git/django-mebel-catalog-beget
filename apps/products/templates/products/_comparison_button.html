<button class="compare-btn{% if product.id in comparison_ids %} active{% endif %} fm-compare-toggle" data-product-id="{{ product.pk }}" data-product-title="{{ product.title }}" data-url="{% url 'catalog:toggle_comparison_ajax' product.pk %}" type="button" aria-pressed="{% if product.id in comparison_ids %}true{% else %}false{% endif %}" aria-label="{% if product.id in comparison_ids %}Убрать из сравнения{% else %}Добавить к сравнению{% endif %}: {{ product.title }}"><svg class="fm-compare-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v14H4zM14 5h6v14h-6zM7 9h0m10 0h0M7 13h0m10 0h0"/></svg><span data-comparison-label>{% if product.id in comparison_ids %}Убрать из сравнения{% else %}Добавить к сравнению{% endif %}</span></button>
