<div id="{{ box_id }}" class="lightbox" role="dialog" aria-modal="true" aria-label="{{ label }}"><button type="button" class="lightbox-close" aria-label="Закрыть просмотр">{% include 'home/includes/furniture_icon.html' with icon='close' icon_class='fm-ui-icon' %}</button><div class="lightbox-top"><button type="button" class="lightbox-prev" aria-label="Предыдущее фото">{% include 'home/includes/furniture_icon.html' with icon='arrow' icon_class='fm-ui-icon fm-ui-back' %}</button><div class="lightbox-counter">Фото <span id="{{ current_id }}">1</span> из <span id="{{ total_id }}">0</span></div><button type="button" class="lightbox-next" aria-label="Следующее фото">{% include 'home/includes/furniture_icon.html' with icon='arrow' icon_class='fm-ui-icon' %}</button></div><img id="{{ image_id }}" class="lightbox-image" alt=""><div id="{{ thumbs_id }}" class="lightbox-thumbs"></div></div>
